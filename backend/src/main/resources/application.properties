spring.application.name=demo
springdotenv.directory=..
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
identity.frontend-url=${FRONTEND_URL:http://localhost:5173}
identity.mail-from=${IDENTITY_MAIL_FROM:}
identity.mail-provider=${IDENTITY_MAIL_PROVIDER:resend}
identity.resend-api-key=${RESEND_API_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
