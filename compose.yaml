name: movie-ticket

services:
  backend:
    build:
      context: ./backend
    image: movie-ticket-backend:local
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST in the root .env}
      POSTGRES_PORT: ${POSTGRES_PORT:?Set POSTGRES_PORT in the root .env}
      POSTGRES: ${POSTGRES:?Set POSTGRES in the root .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      IDENTITY_MAIL_PROVIDER: ${IDENTITY_MAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      IDENTITY_MAIL_FROM: ${IDENTITY_MAIL_FROM:-}
      TICKET_QR_KEYS: ${TICKET_QR_KEYS:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5173/login/oauth2/code/google}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      POSTER_STORAGE_BUCKET: ${POSTER_STORAGE_BUCKET:-movie-posters}
